<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" width="1600" height="400" shape-rendering="geometricPrecision">
  <!-- Palette sampled from source photo: #bfdbf6, #c3def8, #2c93e3, #202732, #4eb38c, #d373bb -->
  <defs>
    <linearGradient id="brandGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c3def8"/>
      <stop offset="42%" stop-color="#bfdbf6"/>
      <stop offset="100%" stop-color="#d5e7f6"/>
    </linearGradient>
    <linearGradient id="topTint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="softShadow" x="-12%" y="-20%" width="124%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1600" height="400" fill="url(#brandGradient)"/>
  <rect width="1600" height="400" fill="url(#topTint)"/>
  <rect x="44" y="60" width="688" height="283.75" rx="14" fill="#000000" opacity="0.12" filter="url(#softShadow)"/>
  <image href="data:image/svg+xml;base64," x="58" y="74" width="660" height="255.75" preserveAspectRatio="xMidYMid meet" opacity="0.92"/>
</svg>
